# G1 pilot (DESIGN.md 5.4): the full-plan model and schedule, stopped after 2 h of wall clock.
# The LR/temperature/momentum schedules are those of the 100-epoch run (max_minutes does not
# change them), so the pilot measures exactly the throughput and early dynamics of the main run.
base: full.yaml
data:
  # R7 pixel size (RUNBOOK 4): after illum correction + normalisation at native resolution, resample
  # every site to 0.65 um/px (antialiased bilinear) before tiling, in the caches and in embed.py.
  # Sources within 2% keep native pixels (2, 10, held-out 6); 3 (x0.920) and 8 (x1.082) are resampled.
  # Identical in every config (tests/test_resample.py); science keys, so part of the run hash.
  resample_um_per_px: 0.65
  resample_tol: 0.02
  # um/px from jump-cellpainting/datasets metadata/microscope_config.csv, column
  # Metadata_Pixel_Size_Microns, at commit b3b4555d44cac440ffda7e25f3adbeb34fbee7fe
  pixel_size_um:
    source_1: 0.597976
    source_2: 0.65
    source_3: 0.597976
    source_4: 0.597976
    source_5: 0.64974
    source_6: 0.646187
    source_7: 0.65
    source_8: 0.7032
    source_9: 0.597976
    source_10: 0.6516944
    source_11: 0.597976
    source_13: 0.65
    source_15: 0.597976
run:
  name: pilot
  max_minutes: 120
  ckpt_every_minutes: 30
eval:
  dev_every_epochs: 1          # one dev evaluation at the end of the first epoch (~25 min at 250/s)
